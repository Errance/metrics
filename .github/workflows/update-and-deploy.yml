name: Refresh data and deploy

on:
  # Refresh at 01:00 UTC every day (09:00 Beijing).
  schedule:
    - cron: '0 1 * * *'
  # Allow manual re-runs from the Actions tab.
  workflow_dispatch:
  # Build & deploy on every push to main (e.g. UI changes).
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh data (fetch all + build-data)
        run: npm run refresh
        env:
          # Optional override: comma-separated list of Solana RPCs.
          # Default uses mainnet-beta + publicnode.
          SOLANA_RPCS: ${{ secrets.SOLANA_RPCS }}
          # Optional override: single BSC RPC URL with deep history.
          BSC_RPC: ${{ secrets.BSC_RPC }}

      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
